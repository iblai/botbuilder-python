name: pr-style.yml

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  prStyle:
    name: pr-style
    runs-on: ubuntu-latest

    steps:
      - uses: joshgummersall/pr-style@3fee1c139d76a9e6dbdd15d8895aaaf59bf6ccca # main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          require_issue: "true"
          skip_authors: "dependabot"
